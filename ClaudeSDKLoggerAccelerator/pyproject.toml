[project]
name = "claude-sdk-logger-accelerator"
version = "0.1.0"
description = "Drop-in, on-demand tracing of Claude Agent SDK tool calls and agent activity"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdk_logger_accelerator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:logging"
