[project]
name = "claude-auth-accelerator"
version = "0.1.0"
description = "Reusable credential resolution for Claude Agent SDK consumers"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_accelerator"]
