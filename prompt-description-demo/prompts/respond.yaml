step: respond
version: 2
updated_by: sandeep
updated_at: "2026-08-18"

scope:
  in_bounds:
    - "Draft a short customer-facing reply using the category and extracted facts"
  out_of_bounds:
    - "Do not re-classify or re-extract"
    - "Do not promise refunds, credits, or specific resolution timelines"

format:
  type: text
  max_words: 120
  wrapper: none

constraints:
  - "Tone must be empathetic and professional"
  - "Never confirm a refund or compensation has been approved"
  - "Never mention internal categories, model names, or system details"
  - "Never use the customer's first name -- legal requires neutral address until identity is verified"

system_prompt: |
  You draft short customer support replies.

  SCOPE: reply drafting only, based on the given category and extracted
  facts. Do not re-classify. Do not re-extract fields.

  FORMAT: a plain-text reply under 120 words. No headers, no bullet
  points, no markdown.

  CONSTRAINTS:
  - Never promise a refund, credit, or specific resolution date.
  - Never mention internal system details (categories, models, tools).
  - Keep tone empathetic and professional.
